        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ki-blue: #00d4ff;
            --ki-orange: #ff6b00;
            --super-saiyan: #ffd700;
            --ultra-instinct: #c0c0ff;
            --void-black: #0a0a0f;
            --cosmic-purple: #8b00ff;
        }

            background: var(--void-black);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Cosmic background animation */
        .cosmos {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(139, 0, 255, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 212, 255, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 107, 0, 0.1) 0%, transparent 70%),
                var(--void-black);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image:
                radial-gradient(2px 2px at 20px 30px, white, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, white, transparent),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 230px 80px, white, transparent),
                radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.7), transparent);
            background-size: 350px 200px;
            animation: twinkle 5s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Genki Dama floating sphere */
        .genki-dama {
            position: fixed;
            top: 10%;
            right: 5%;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                white 0%,
                var(--ki-blue) 30%,
                var(--cosmic-purple) 60%,
                transparent 100%);
            box-shadow:
                0 0 60px var(--ki-blue),
                0 0 120px var(--cosmic-purple),
                inset 0 0 60px rgba(255,255,255,0.5);
            animation: pulse-sphere 3s ease-in-out infinite, float 6s ease-in-out infinite;
            opacity: 0.8;
        }

        @keyframes pulse-sphere {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -20px; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 900;
            background: linear-gradient(90deg, var(--ki-orange), var(--super-saiyan), var(--ki-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 107, 0, 0.5);
            animation: glow-text 2s ease-in-out infinite alternate;
            margin-bottom: 0.5rem;
        }

        @keyframes glow-text {

            to { filter: drop-shadow(0 0 30px var(--super-saiyan)); }
        }

        .subtitle {
            font-size: 1rem;
            color: var(--ultra-instinct);
            letter-spacing: 3px;
            opacity: 0.8;
        }

        .era-badge {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            background: linear-gradient(135deg, rgba(139, 0, 255, 0.3), rgba(0, 212, 255, 0.3));
            border: 1px solid var(--ki-blue);
            border-radius: 50px;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        /* Scale Selector */
        .scale-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .scale-btn {
            padding: 1rem 2rem;
            border: 2px solid var(--ki-blue);
            background: transparent;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        .scale-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.3), transparent);
            transition: 0.5s;
        }

        .scale-btn:hover::before {
            left: 100%;
        }

        .scale-btn:hover, .scale-btn.active {
            background: linear-gradient(135deg, var(--ki-blue), var(--cosmic-purple));
            border-color: var(--super-saiyan);
            box-shadow: 0 0 30px var(--ki-blue);
            transform: translateY(-3px);
        }

        .scale-btn .scale-label {
            display: block;
            font-size: 1.5rem;
            font-weight: 900;
        }

        .scale-btn .scale-desc {
            font-size: 0.6rem;
            opacity: 0.7;
            margin-top: 0.3rem;
        }

        .scale-btn.beyond {
            border-color: var(--super-saiyan);
            animation: beyond-glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes beyond-glow {
            from { box-shadow: 0 0 10px var(--super-saiyan); }
            to { box-shadow: 0 0 40px var(--super-saiyan), 0 0 80px var(--ki-orange); }

            text-align: center;
            margin-bottom: 3rem;
        }

            padding: 1.5rem 4rem;
            font-size: 1.5rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            background: linear-gradient(135deg, var(--ki-orange), var(--super-saiyan));
            border: none;
            border-radius: 50px;
            color: var(--void-black);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .generate-btn:hover {
            transform: scale(1.05);
            box-shadow:

        }

        .result-container {

        .idea-target {

            border-radius: 20px;
            font-size: 0.7rem;

        .steps-title {

            font-size: 0.8rem;

            }

                font-size: 1.2rem;
            }
        }
    </style>
</head>
